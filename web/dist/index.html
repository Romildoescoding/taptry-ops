<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TapTry Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="frame">
  <header class="top">
    <a class="brand" href="#dashboard"><b>TapTry</b><span>ops</span></a>
    <nav id="nav" class="pills">
      <a href="#dashboard">Dashboard</a>
      <a href="#inbox">Inbox <i id="navCount"></i></a>
      <a href="#leads">Leads</a>
      <a href="#outreach">Outreach</a>
      <a href="#product">Product</a>
      <a href="#costs">Costs</a>
      <a href="#system">System</a>
    </nav>
    <div class="top-actions">
      <button id="refreshBtn" class="icon-btn" title="Refresh everything" aria-label="Refresh">↻</button>
      <form method="post" action="/auth/logout"><button class="icon-btn" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></form>
    </div>
  </header>
  <div id="fresh" class="fresh" hidden></div>
  <main id="main"><div class="loading">Loading…</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
