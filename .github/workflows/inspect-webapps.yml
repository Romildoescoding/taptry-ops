name: inspect-webapps
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Stored web app URLs and how they respond
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute taptry-ops --remote --json --command "SELECT key, value FROM config WHERE key LIKE 'gas_url_%' OR key LIKE 'last_push_mail_%'" > out.json
          node -e 'const r=require("./out.json")[0].results; for (const x of r) console.log(x.key, x.value)'
          for u in $(node -e 'for (const x of require("./out.json")[0].results) if (x.key.startsWith("gas_url_")) console.log(JSON.parse(x.value))'); do
            id=$(echo "$u" | sed -E 's#.*/s/([^/]+)/exec#\1#')
            for v in "https://script.google.com/macros/s/$id/exec" "https://script.google.com/a/macros/taptry.in/s/$id/exec"; do
              echo "== $v"
              curl -s -o body.txt -w "first hop: %{http_code} -> %{redirect_url}\n" -X POST -H 'Content-Type: text/plain' --data '{}' "$v"
              curl -s -L -o body.txt -w "after redirects: %{http_code}\n" -X POST -H 'Content-Type: text/plain' --data '{}' "$v"; head -c 200 body.txt; echo
            done
          done
